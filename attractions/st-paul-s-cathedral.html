      <section class="reading-block reading-block--supplement"><h2>補充資訊</h2><p>聖保羅教堂是倫敦最具代表性的地標之一，由建築師 Christopher Wren 設計。高 111 公尺的圓頂是世界第二大的教堂圓頂，也是英國巴洛克建築的代表作，長期構成倫敦天際線的重要輪廓。</p>
<p>看點：三層圓頂結構、英國巴洛克建築、倫敦天際線、教堂內部。</p></section>
